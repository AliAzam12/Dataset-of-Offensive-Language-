# Traditional Machine Learning Baseline Configurations
# Dataset: Cleaned Multilingual Offensive Language Dataset (Urdu, Roman Urdu, Pashto, English)

seed: 42
data:
  train_path: "Dataset/train.csv"
  val_path: "Dataset/validation.csv"
  test_path: "Dataset/test.csv"
  full_path: "Dataset/full_data.csv"
  text_column: "clean_text"
  label_column: "label_id"

features:
  word_tfidf:
    ngram_range: [1, 2]
    max_features: 10000
    sublinear_tf: true
  char_tfidf:
    ngram_range: [2, 5]
    analyzer: "char"
    max_features: 15000
    sublinear_tf: true
  combined_tfidf:
    word_max_features: 8000
    char_max_features: 12000

models:
  Multinomial_Naive_Bayes:
    alpha_candidates: [0.01, 0.1, 0.5, 1.0]
  Logistic_Regression:
    C_candidates: [0.1, 1.0, 5.0, 10.0]
    max_iter: 1000
    class_weight: "balanced"
  Linear_SVM:
    C_candidates: [0.01, 0.1, 1.0, 5.0]
    max_iter: 2000
    class_weight: "balanced"
  Random_Forest:
    n_estimators: 50
    max_depth: null
    random_state: 42
